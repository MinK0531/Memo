<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/default}">


    <section layout:fragment="contents" class="contents d-flex justify-content-center">
        <div class="user-box my-5 p-5 rounded-lg">
            <h2 class="text-center">로그인</h2>
            <form id="loginForm">
                <input type="text" class="form-control mt-4" placeholder="아이디" id="idInput">
                <input type="password" class="form-control mt-2" placeholder="비밀번호" id="passwordInput">
                <button type="submit" class="btn btn-secondary btn-block mt-3" id="loginBtn">로그인</button>
            </form>
            <div class="mt-4 d-flex justify-content-center">
                <a href="/user/join">회원가입</a>
            </div>
        </div>
    </section>

    <script layout:fragment="script">
        $("#loginForm").on("sumbit",function (e){

            // form태그 submit 이벤트가 가지는 요청기능을 취소
            // 해당 이벤트에 포함된 모든 기능 취소
            e.preventDefault();


            let id = $("#idInput").val();
            let password = $("#passwordInput").val();

            if(id == ""){
                alert("아이디를 입력하세요");
                return;
            }

            if(password == ""){
                alert("비밀번호를 입력하세요");
                return;
            }

            $.ajax({
                type: "post"
                ,url:"/user/login-process"
                ,data:{"loginId":id, "password":password}
                ,success: function (response){
                    if(response.result == "success"){
                        location.href = "/memo/list";
                    }else {
                        alert("아이디와 비밀번호를 확인해 주세요");
                    }
                }
                ,error: function (){
                    alert("로그인 에러!");
                }

            });

        });

        $("#loginBtn").on("click", function (){
            let id = $("#idInput").val();
            let password = $("#passwordInput").val();

            if(id == ""){
                alert("아이디를 입력하세요");
                return;
            }

            if(password == ""){
                alert("비밀번호를 입력하세요");
                return;
            }

            $.ajax({
                type: "post"
                ,url:"/user/login-process"
                ,data:{"loginId":id, "password":password}
                ,success: function (response){
                    if(response.result == "success"){
                        location.href = "/memo/list";
                    }else {
                        alert("아이디와 비밀번호를 확인해 주세요");
                    }
                }
                ,error: function (){
                    alert("로그인 에러!");
                }

            });

        });
    </script>

</html>
